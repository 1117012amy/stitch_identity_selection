<script>
        // Micro-interaction for toggle switches
        document.querySelectorAll('input[type="checkbox"]').forEach(toggle => {
            toggle.addEventListener('change', function() {
                const parent = this.closest('div');
                if(this.checked) {
                    parent.classList.add('neo-brutal-shadow-yellow');
                } else {
                    parent.classList.remove('neo-brutal-shadow-yellow');
                }
            });
        });

        // Simple parallax effect on scroll for geometric blocks
        window.addEventListener('scroll', () => {
            const scrolled = window.pageYOffset;
            document.querySelectorAll('.neo-brutal-shadow-yellow').forEach(el => {
                const speed = 0.05;
                el.style.transform = `translateY(${scrolled * speed}px)`;
            });
        });
    </script>
